<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Formulário Completo</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Cadastro</h1>
    </header>

    <main>

        <!-- Formulário de Cadastro -->
        <section>
            <p>O formulario de cadastro deve ser desenvolvido aqui</p>

            <form id="formCadastro">

                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <p>Este é um formulário de fieldset.</p>
                    <p>Nome completo:</p>
                    <P><input type="text" id="nome" name="nome" required minlength="3" placeholder="Seu nome"></p>
                    <p>Email:</p>
                    <p><input type="email" id="email" name="e-mail" minlength="3" placeholder="Seu email"></p>

                    <p>Data de nascimento:</p>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>

                </fieldset>
                <fieldset>

                    <legend>Informações</legend>
                    <label for=”masc”>Masculino</label>
                    <input type="radio" name="genero" id=”masc” value="masculino">
                    <label for=”femi”>Feminino</label>
                    <input type="radio" name="genero" id=”femi” value="feminino">
                    <label for=”n_inf”>Outro</label>
                    <input type="radio" name="genero" id=”n_inf” value="Outro">

                </fieldset>
                <fieldset>
                    <legend>Interesses</legend>
                    <label for=”Tec”>Tecnologia</label>
                    <input type="checkbox" name="interesses" id=”Tec” value="Tecnologia">
                    <label for=”Esp”>Esporte</label>
                    <input type="checkbox" name="interesses" id=”Esp” value="Esporte">
                    <label for=”mus”>Musica</label>
                    <input type="checkbox" name="interesses" id=”mus” value="Musica">
                    <label for=”Jog”>Jogos</label>
                    <input type="checkbox" name="interesses" id=”Jog” value="Jogos">
                </fieldset>
                <fieldset>
                    <legend>Estado</legend>
                    <select name="Estado" id="estado">
                        <option value="sp">São Paulo</option>
                        <option value="pr">Paraná</option>
                        <option value="ba">Bahia</option>
                    </select>
                </fieldset>
                <fieldset>
                    <legend>Mensagem</legend>
                    <p><input type='text'></p>

                <body>
<h2>Upload de imagem</h2>

<input type="file" id="arquivo" name="arquivo" accept=".png, .jpg, .jpeg" required>
<br><br>
<button type="submit">Enviar</button>
<button type="reset">Limpar</button>
</form>
</body>

                    
                </fieldset>


            </form>
        </section>

        <!-- Resultado será exibido aqui, não é necessário editar-->
        <section>
            <h2 id="sec-resultado">Resultado</h2>
            <div id="resultado"></div>
        </section>

    </main>

                    alt="Documentação CSS" width="40">

        </nav>

    </footer>

</body>
